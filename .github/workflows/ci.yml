name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Validate manifest template
        run: coprogrammer manifest validate templates/change-manifest.json

      - name: Validate CoProgrammer config
        run: coprogrammer config validate

      - name: Validate upgrade manifest
        run: coprogrammer manifest validate docs/upgrade-v0.2/change-manifest.json

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
