[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coprogrammer"
version = "0.1.0"
description = "Open protocol and toolkit for semantic integration in multi-agent software development."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Qiu Guanzong" }
]
keywords = ["ai", "software-development", "multi-agent", "merge", "code-review"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/QIU-Guanzong/CoProgrammer"
Repository = "https://github.com/QIU-Guanzong/CoProgrammer"
Issues = "https://github.com/QIU-Guanzong/CoProgrammer/issues"

[project.scripts]
coprogrammer = "coprogrammer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
