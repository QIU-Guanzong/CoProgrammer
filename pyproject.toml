[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coprogrammer"
version = "0.3.0a6"
description = "Coordinate AI coding agents across Git worktrees: tasks, conflict checks and handoffs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Qiu Guanzong" }
]
keywords = ["ai-agents", "multi-agent", "agent-harness", "mcp", "codex", "claude-code", "openclaw", "workbuddy", "git-worktree", "task-scheduling", "code-review"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/QIU-Guanzong/CoProgrammer"
Repository = "https://github.com/QIU-Guanzong/CoProgrammer"
Issues = "https://github.com/QIU-Guanzong/CoProgrammer/issues"

[project.scripts]
coprogrammer = "coprogrammer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coprogrammer = ["assets/skills/*/SKILL.md", "assets/templates/*.md"]
